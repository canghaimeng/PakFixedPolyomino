name: Lean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check main theorems
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Configure build memory
        run: |
          sudo fallocate -l 8G /swapfile-pak
          sudo chmod 600 /swapfile-pak
          sudo mkswap /swapfile-pak
          sudo swapon /swapfile-pak
          free -h
      - name: Download pinned mathlib cache
        run: |
          lake exe cache get
          git diff --exit-code -- lean-toolchain lake-manifest.json
      - name: Build the library
        run: lake build
      - name: Check theorem type and transitive axioms
        run: lake env lean Check.lean
